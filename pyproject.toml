[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vvv"
version = "0.8.0"
description = "A fast, minimalist 3D/4D medical image viewer, successor to VV."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "David Sarrut", email = "david.sarrut@creatis.insa-lyon.fr" }]
keywords = ["medical imaging", "image viewer", "DICOM", "NIfTI", "radiotherapy", "4D", "MPR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Environment :: X11 Applications",
]
dependencies = [
    "click",
    "SimpleITK",
    "dearpygui>=2.3.1",
    "numpy",
    "scikit-image",
    "Pillow",
    "setproctitle",
    "pydicom",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "fabio",
    "numba"
]

[project.urls]
Homepage = "https://github.com/dsarrut/vvv"
Documentation = "https://github.com/dsarrut/vvv/blob/master/user_docs/README.md"
Source = "https://github.com/dsarrut/vvv"
Issues = "https://github.com/dsarrut/vvv/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "fonttools"
]
memory = [
    "psutil"
]

[tool.setuptools.package-data]
"vvv" = ["fonts/*", "icons/*"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
# This line creates the 'vvv' command in your shell
vvv = "vvv.cli:main"
vvv_image_info = "vvv.cli_info:main"
checkerboard = "vvv.checkerboard:create_checkerboard"

[tool.pytest.ini_options]
testpaths = ["tests", "src/vvv/plugins"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:SOCKS support in urllib3 requires the installation",
]

